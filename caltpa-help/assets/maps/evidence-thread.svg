<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="456" viewBox="0 0 1400 456" role="img"><title>Keep the reasoning connected</title><rect width="100%" height="100%" fill="white"/><text x="45" y="60" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="bold" fill="#23332d">Keep the reasoning connected</text><text x="45" y="102" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="normal" fill="#56635f">What you know → What you do → What students show → What comes next</text><path d="M45,142 h290" stroke="#256249" stroke-width="6"/><text x="45" y="182" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#256249">Students</text><text x="45" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#256249">Assets and needs</text><text x="45" y="288" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Identify recent learning,</text><text x="45" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">language resources,</text><text x="45" y="348" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">interests, and relevant</text><text x="45" y="378" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">supports.</text><path d="M45,426 h285" stroke="#d7dfda"/><path d="M370,142 h290" stroke="#265a82" stroke-width="6"/><text x="370" y="182" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#265a82">Teaching</text><text x="370" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#265a82">A purposeful choice</text><text x="370" y="288" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Connect the goal, task,</text><text x="370" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">adaptation, and assessment</text><text x="370" y="348" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">to that information.</text><path d="M370,396 h285" stroke="#d7dfda"/><path d="M695,142 h290" stroke="#913f51" stroke-width="6"/><text x="695" y="182" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#913f51">Evidence</text><text x="695" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#913f51">An interpretable response</text><text x="695" y="288" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Locate what a student says,</text><text x="695" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">writes, makes, or does.</text><text x="695" y="348" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Explain its meaning and</text><text x="695" y="378" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">limits.</text><path d="M695,426 h285" stroke="#d7dfda"/><path d="M1020,142 h290" stroke="#8a651a" stroke-width="6"/><text x="1020" y="182" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#8a651a">Next steps</text><text x="1020" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#8a651a">A justified response</text><text x="1020" y="288" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Use the evidence to choose</text><text x="1020" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">an activity and a way to</text><text x="1020" y="348" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">check further learning.</text><path d="M1020,396 h285" stroke="#d7dfda"/></svg>