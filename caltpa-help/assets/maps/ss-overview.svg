<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="804" viewBox="0 0 1400 804" role="img"><title>CalTPA at a glance</title><rect width="100%" height="100%" fill="white"/><text x="45" y="60" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="bold" fill="#23332d">CalTPA at a glance</text><text x="45" y="102" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="normal" fill="#56635f">Single Subject | Two assessments, each with all four steps</text><path d="M45,142 h615" stroke="#256249" stroke-width="6"/><text x="45" y="182" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#256249">Cycle 1</text><text x="45" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#256249">1  Plan</text><text x="45" y="288" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Three focus students. Connect assets and recent</text><text x="45" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">learning to goals, tasks, supports, and assessment.</text><path d="M45,366 h610" stroke="#d7dfda"/><text x="45" y="376" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#256249">2  Teach &amp; Assess</text><text x="45" y="414" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Record actual teaching. Observe student thinking,</text><text x="45" y="444" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">respond to learning, and explain specific moments.</text><path d="M45,492 h610" stroke="#d7dfda"/><text x="45" y="502" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#256249">3  Reflect</text><text x="45" y="540" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Interpret learning evidence against the goals. Explain</text><text x="45" y="570" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">progress, difficulties, and the effects of</text><text x="45" y="600" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">instruction.</text><path d="M45,648 h610" stroke="#d7dfda"/><text x="45" y="658" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#256249">4  Apply</text><text x="45" y="696" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Justify the next instruction.</text><path d="M45,744 h610" stroke="#d7dfda"/><path d="M695,142 h615" stroke="#265a82" stroke-width="6"/><text x="695" y="182" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#265a82">Cycle 2</text><text x="695" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#265a82">1  Plan</text><text x="695" y="288" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">One focus student. Connect assets and recent learning</text><text x="695" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">to goals, tasks, supports, and assessment.</text><path d="M695,366 h610" stroke="#d7dfda"/><text x="695" y="376" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#265a82">2  Teach &amp; Assess</text><text x="695" y="414" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Record actual teaching. Observe student thinking,</text><text x="695" y="444" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">respond to learning, and explain specific moments.</text><path d="M695,492 h610" stroke="#d7dfda"/><text x="695" y="502" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#265a82">3  Reflect</text><text x="695" y="540" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Interpret learning evidence against the goals. Explain</text><text x="695" y="570" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">progress, difficulties, and the effects of</text><text x="695" y="600" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">instruction.</text><path d="M695,648 h610" stroke="#d7dfda"/><text x="695" y="658" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#265a82">4  Apply</text><text x="695" y="696" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Teach and record a focused follow-up. Explain what the</text><text x="695" y="726" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">student demonstrates.</text><path d="M695,774 h610" stroke="#d7dfda"/></svg>