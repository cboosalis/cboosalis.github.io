<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Plan camera coverage and student audio</title><desc id="desc">Two schematic classroom arrangements. In whole-class teaching a stable side camera faces the teacher, display, and student group. During partner or small-group work a closer camera covers the teacher and students, with audio capture near the student voices. Check permissions and the current guide.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#226447" stroke-width="1.5"/></marker></defs>
<rect width="1100" height="560" rx="14" fill="#f2f6f3"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#22302c">
<text x="35" y="44" font-size="25" font-weight="700">Plan the view. Test the voices. Preserve the learning.</text>
<text x="35" y="74" font-size="17">Two possible arrangements — adapt to your classroom, permissions, and assessment.</text>
<rect x="30" y="100" width="505" height="365" rx="8" fill="#fff" stroke="#a7b7ad"/>
<rect x="565" y="100" width="505" height="365" rx="8" fill="#fff" stroke="#a7b7ad"/>
<text x="50" y="132" font-size="21" font-weight="700">A. Whole-class explanation</text>
<rect x="210" y="153" width="215" height="38" rx="4" fill="#e5f1e9" stroke="#226447"/>
<text x="232" y="178" font-size="17">Display / board</text>
<circle cx="315" cy="224" r="22" fill="#226447"/><text x="309" y="231" font-size="19" fill="#fff">T</text>
<g fill="#dceaf5" stroke="#235d88"><circle cx="180" cy="304" r="20"/><circle cx="260" cy="304" r="20"/><circle cx="340" cy="304" r="20"/><circle cx="420" cy="304" r="20"/><circle cx="210" cy="370" r="20"/><circle cx="290" cy="370" r="20"/><circle cx="370" cy="370" r="20"/></g>
<text x="227" y="342" font-size="16">Student voices</text>
<rect x="61" y="372" width="52" height="39" rx="5" fill="#235d88"/>
<text x="78" y="399" font-size="24" fill="#fff">C</text>
<path d="M108 370L264 236M116 399L441 287" fill="none" stroke="#226447" stroke-width="2" stroke-dasharray="6 5"/>
<text x="53" y="442" font-size="16">Stable diagonal view; test the farthest voice.</text>
<text x="585" y="132" font-size="21" font-weight="700">B. Partner / small-group reasoning</text>
<rect x="750" y="235" width="210" height="110" rx="30" fill="#e5f1e9" stroke="#226447"/>
<circle cx="855" cy="203" r="22" fill="#226447"/><text x="849" y="210" font-size="19" fill="#fff">T</text>
<g fill="#dceaf5" stroke="#235d88"><circle cx="740" cy="249" r="20"/><circle cx="788" cy="362" r="20"/><circle cx="920" cy="362" r="20"/><circle cx="972" cy="250" r="20"/></g>
<circle cx="855" cy="291" r="19" fill="#a43e62"/><text x="847" y="298" font-size="19" fill="#fff">M</text>
<rect x="605" y="338" width="52" height="39" rx="5" fill="#235d88"/><text x="622" y="365" font-size="24" fill="#fff">C</text>
<path d="M658 348L814 216M658 375L953 387" fill="none" stroke="#226447" stroke-width="2" stroke-dasharray="6 5"/>
<text x="599" y="414" font-size="16">Frame teacher + students; keep audio nearby.</text>
<text x="599" y="442" font-size="16">Reposition only with a safe, practiced plan.</text>
<text x="35" y="501" font-size="18" font-weight="700">C = camera   T = teacher   M = possible student-audio location</text>
<text x="35" y="532" font-size="17">Play back a test with headphones. A teacher microphone alone may miss the discussion.</text>
</g></svg>
