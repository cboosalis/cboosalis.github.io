<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="456" viewBox="0 0 1400 456" role="img"><title>Literacy Performance Assessment</title><rect width="100%" height="100%" fill="white"/><text x="45" y="60" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="bold" fill="#23332d">Literacy Performance Assessment</text><text x="45" y="102" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="normal" fill="#56635f">Multiple Subject | One focus student | Three lessons + follow-up</text><path d="M45,142 h290" stroke="#256249" stroke-width="6"/><text x="45" y="182" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#256249">1  Plan</text><text x="45" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#256249">Teaching work</text><text x="45" y="288" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">One focus student. Connect</text><text x="45" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">assets and recent learning</text><text x="45" y="348" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">to goals, tasks, supports,</text><text x="45" y="378" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">and assessment.</text><path d="M45,426 h285" stroke="#d7dfda"/><path d="M370,142 h290" stroke="#265a82" stroke-width="6"/><text x="370" y="182" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#265a82">2  Teach &amp; Assess</text><text x="370" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#265a82">Teaching work</text><text x="370" y="288" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Record actual teaching.</text><text x="370" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Observe student thinking,</text><text x="370" y="348" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">respond to learning, and</text><text x="370" y="378" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">explain specific moments.</text><path d="M370,426 h285" stroke="#d7dfda"/><path d="M695,142 h290" stroke="#913f51" stroke-width="6"/><text x="695" y="182" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#913f51">3  Reflect</text><text x="695" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#913f51">Teaching work</text><text x="695" y="288" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Interpret learning evidence</text><text x="695" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">against the goals. Explain</text><text x="695" y="348" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">progress, difficulties, and</text><text x="695" y="378" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">the effects of instruction.</text><path d="M695,426 h285" stroke="#d7dfda"/><path d="M1020,142 h290" stroke="#8a651a" stroke-width="6"/><text x="1020" y="182" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#8a651a">4  Apply</text><text x="1020" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="bold" fill="#8a651a">Teaching work</text><text x="1020" y="288" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">Teach and record a focused</text><text x="1020" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">follow-up. Explain what the</text><text x="1020" y="348" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#23332d">student demonstrates.</text><path d="M1020,396 h285" stroke="#d7dfda"/></svg>